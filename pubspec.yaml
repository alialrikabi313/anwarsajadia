name: anwarsajadia
description: "Anwar Al-Sajjadiya - Islamic Religious Application"
publish_to: 'none'
# تحديثٌ فوق المنشور بكوكل بلي. الرقم بعد الـ + هو versionCode ولازم يكون
# أعلى من كل ما رُفع قبله — وآخر باندل بُني حمل 20000 (باسم 2.0.0، وهو ما
# وُقِّع ونُشر). الاصطلاح المتّبع: major*10000 + minor*100 + patch.
version: 2.0.3+20003

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Functional Programming
  fpdart: ^1.1.0
  shia_hijri_calendar: ^0.3.2


  # Navigation
  go_router: ^14.8.1

  # Data Classes (runtime)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Local Storage
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # Audio
  just_audio: ^0.9.42
  audio_service: ^0.18.17

  # Video
  video_player: ^2.9.2
  chewie: ^1.8.5
  youtube_player_flutter: ^9.1.1

  # Images
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0

  # Qibla / Location
  flutter_compass: ^0.8.1
  geolocator: ^13.0.2

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Networking / Connectivity
  http: ^1.2.2
  connectivity_plus: ^6.1.1

  # Sharing
  share_plus: ^10.1.4

  # Open external URLs (YouTube videos)
  url_launcher: ^6.3.1

  # In-app PDF reading + downloading book PDFs
  flutter_pdfview: ^1.3.2
  flutter_file_downloader: ^2.1.0
  gal: ^2.3.0

  # UI
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0

  # Icons
  cupertino_icons: ^1.0.8

  # Intl
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  very_good_analysis: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  freezed: ^3.2.5
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/ornaments/
    - assets/images/icons/
    - assets/images/backgrounds/
    - assets/images/content/
    - assets/images/martyrs/
    - assets/images/maqamat/
    - assets/images/gallery/
    - assets/figma_assets/
    - assets/figma_assets/posters/
    - assets/figma_assets/shrines/
    - assets/figma_assets/svg/
    - assets/figma_assets/lib_icons/
    - assets/data/
    - assets/books/
    - assets/quran/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
