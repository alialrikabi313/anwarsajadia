include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    # نرتّب الاستيرادات بثلاث طبقات (dart ← طرف ثالث ← anwarsajadia) مثل ما بـ
    # CLAUDE.md، والقاعدة هذي تريدها أبجدية معاً فتدفع المحلي للأول لأن
    # 'anwarsajadia' قبل 'flutter'. الطبقات أوضح للقارئ، فنعطّلها.
    directives_ordering: false
